<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Price Predictor</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--a:#6366f1;--b:#06b6d4}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--text:#e8ecf5;--muted:#94a3b8;--line:#2a3350}}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.hero{text-align:center;padding:56px 20px 34px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem)}
.hero p{max-width:640px;margin:10px auto 0;opacity:.93}
main{width:min(1400px,100%);margin:0 auto;padding:28px clamp(16px,5vw,64px) 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,32px);margin-bottom:20px;box-shadow:0 4px 18px rgba(15,23,42,.06)}
.card h2{font-size:1.1rem;margin-bottom:6px}
.row{padding:16px 0}
.row+.row{border-top:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.top b{display:block}
.top small{color:var(--muted)}
.val{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;white-space:nowrap}
.val input{width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-weight:700;text-align:right}
.val input:focus{outline:2px solid var(--a);border-color:transparent}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--a) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--a);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--a);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding-top:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:10px 22px;border:1.5px solid var(--line);border-radius:99px;cursor:pointer;font-weight:600;user-select:none}
.chip input:checked+span{background:var(--a);border-color:var(--a);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--b)}
#go{width:100%;padding:17px;border:0;border-radius:14px;font:inherit;font-size:1.15rem;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 22px rgba(99,102,241,.35)}
#go:disabled{opacity:.6;cursor:wait}
#err{color:#dc2626;text-align:center;margin-top:12px}
#result{text-align:center;border:2px solid var(--a);padding-block:34px;scroll-margin-top:20px}
#result .lbl{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
#result .big{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;margin:8px 0;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#result .note{color:var(--muted);font-size:.9rem;max-width:560px;margin:0 auto}
</style>
</head>
<body>
<header class="hero">
  <h1>📱 Phone Price Predictor</h1>
  <p>Set your phone's specs below. Drag a slider, or type an exact value in the box, then press Predict.</p>
</header>

<main>
  <form id="form" novalidate></form>

  <section id="result" class="card" hidden>
    <div class="lbl" id="rl"></div>
    <div class="big" id="rv"></div>
    <p class="note">Based on specs only. Brand, design and offers can move the real price up or down.</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

const SECTIONS = [
  { t: "📺 Display", f: [
    { id: "screen_size", l: "Screen size", u: "inches", min: 1, max: 8, step: 0.1, v: 6.1, h: "Most phones are 6.0 – 6.8 inches" },
    { id: "refresh_rate", l: "Refresh rate", u: "Hz", min: 60, max: 144, step: 1, v: 90, h: "60 Hz is standard, 90 / 120 Hz feels smoother" },
    { id: "resolution_width", l: "Resolution width", u: "px", min: 240, max: 2500, step: 10, v: 1080, h: "Full HD is 1080 × 2400" },
    { id: "resolution_height", l: "Resolution height", u: "px", min: 320, max: 3900, step: 10, v: 2400, h: "Full HD is 1080 × 2400" } ] },
  { t: "⚡ Performance", f: [
    { id: "ram_gb", l: "RAM", u: "GB", stops: [0.5, 1, 2, 3, 4, 6, 8, 12, 16, 18], v: 8, h: "Memory for running apps" },
    { id: "storage_gb", l: "Storage", u: "GB", stops: [4, 8, 16, 32, 64, 128, 256, 512, 1024], v: 128, h: "Space for photos, apps and files" },
    { id: "cpu_cores", l: "Processor cores", u: "cores", min: 1, max: 10, step: 1, v: 8, h: "Most phones have 8 cores" },
    { id: "cpu_speed", l: "Processor speed", u: "GHz", min: 1, max: 3.5, step: 0.05, v: 2.4, h: "Top clock speed of the fastest core" } ] },
  { t: "📷 Camera", f: [
    { id: "rear_camera_mp", l: "Rear camera", u: "MP", min: 0, max: 200, step: 1, v: 50, h: "Main back camera resolution" },
    { id: "front_camera_mp", l: "Front camera", u: "MP", min: 2, max: 60, step: 1, v: 16, h: "Selfie camera resolution" },
    { id: "rear_camera_count", l: "Number of rear cameras", u: "cameras", min: 0, max: 3, step: 1, v: 2, h: "Cameras on the back of the phone" } ] },
  { t: "🔋 Battery & Charging", f: [
    { id: "battery_mah", l: "Battery capacity", u: "mAh", min: 1000, max: 8500, step: 50, v: 5000, h: "Most phones are 4000 – 5500 mAh" },
    { id: "charging_w", l: "Charging speed", u: "W", min: 10, max: 180, step: 1, v: 33, h: "Fast charging is usually 30 W and above" } ] }
];

const TOGGLES = [
  { id: "has_5g", l: "5G" }, { id: "has_4g", l: "4G", on: 1 }, { id: "has_3g", l: "3G", on: 1 },
  { id: "has_wifi", l: "Wi-Fi", on: 1 }, { id: "has_nfc", l: "NFC" }
];

// ---- Build the form ----
$("form").innerHTML =
  SECTIONS.map(s => `<section class="card"><h2>${s.t}</h2>${s.f.map(f => `
    <div class="row">
      <div class="top">
        <div><b>${f.l}</b><small>${f.h}</small></div>
        <label class="val"><input id="n_${f.id}" type="number" step="any" inputmode="decimal" value="${f.v}"> ${f.u}</label>
      </div>
      <input id="s_${f.id}" type="range" ${f.stops ? `min="0" max="${f.stops.length - 1}" step="1"` : `min="${f.min}" max="${f.max}" step="${f.step}"`}>
    </div>`).join("")}</section>`).join("") +
  `<section class="card"><h2>📶 Connectivity</h2><div class="chips">${TOGGLES.map(t => `
    <label class="chip"><input type="checkbox" id="c_${t.id}" ${t.on ? "checked" : ""}><span>${t.l}</span></label>`).join("")}
  </div></section>
  <button id="go" type="submit">Predict price</button><div id="err"></div>`;

// ---- Slider <-> number box sync ----
const FIELDS = SECTIONS.flatMap(s => s.f);
const nearest = (f, v) => f.stops.reduce((b, x, i) => Math.abs(x - v) < Math.abs(f.stops[b] - v) ? i : b, 0);
const paint = r => r.style.setProperty("--p", (r.value - r.min) / (r.max - r.min) * 100 + "%");

FIELDS.forEach(f => {
  const s = $("s_" + f.id), n = $("n_" + f.id);
  const lo = f.stops ? f.stops[0] : f.min, hi = f.stops ? f.stops[f.stops.length - 1] : f.max;
  const clamp = v => Math.min(hi, Math.max(lo, v));
  const sync = v => { s.value = f.stops ? nearest(f, v) : v; paint(s); };

  sync(f.v);
  s.oninput = () => { n.value = f.stops ? f.stops[s.value] : s.value; paint(s); };
  n.oninput = () => { const v = parseFloat(n.value); if (!isNaN(v)) sync(clamp(v)); };
  n.onchange = () => { let v = parseFloat(n.value); v = clamp(isNaN(v) ? f.v : v); n.value = v; sync(v); };
});

// ---- Predict ----
const inr = n => "₹" + n.toLocaleString("en-IN");

$("form").onsubmit = async e => {
  e.preventDefault();
  const body = {};
  FIELDS.forEach(f => { const v = parseFloat($("n_" + f.id).value); body[f.id] = isNaN(v) ? f.v : v; });
  TOGGLES.forEach(t => body[t.id] = $("c_" + t.id).checked ? 1 : 0);

  const btn = $("go");
  btn.disabled = true; btn.textContent = "Predicting…"; $("err").textContent = "";

  try {
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error();
    const d = await r.json();

    if (d.mode === "single") {
      $("rl").textContent = "Estimated price";
      $("rv").textContent = "About " + inr(d.value);
    } else {
      $("rl").textContent = "Estimated price range";
      $("rv").textContent = inr(d.low) + " – " + inr(d.high);
    }
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch {
    $("err").textContent = "Something went wrong. Please check that the server is running and try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Predict price";
  }
};
</script>
</body>
</html>
